# ClusterSecretStore — cluster-wide Vault backend.
#
# Any namespace can reference this store by setting:
#   secretStoreRef:
#     name: vault-cluster-backend
#     kind: ClusterSecretStore
#
# The 'eso-cluster-read' Vault policy allows reading all keys under 'ee/data/*'.
# For tighter scope use the namespaced SecretStore (secretstore.yaml) instead.
#
# The serviceAccountRef namespace must be explicit in a ClusterSecretStore.
#
# Prerequisites:
#   - clusterserviceaccount.yaml applied
#   - Vault role 'eso-cluster' created by init.sh
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      # KV v2 mount — matches 'ee' prefix used in paths like 'ee/ai-gateway/...'
      path: "ee"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-cluster"
          serviceAccountRef:
            name: "eso-vault-auth-cluster"
            # Namespace is required for ClusterSecretStore.
            namespace: "external-secrets"
