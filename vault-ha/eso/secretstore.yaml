# Namespaced SecretStore for the ai-gateway namespace.
#
# Scope is narrower than the ClusterSecretStore: the 'eso-ai-gateway-read'
# Vault policy only grants read on 'ee/data/ai-gateway/*', so a compromised
# workload in this namespace cannot read secrets from other paths.
#
# Prerequisites:
#   - ai-gateway namespace exists
#   - Vault role 'eso-ai-gateway' created by init.sh
#   - Apply before creating ExternalSecrets in ai-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth
  namespace: ai-gateway
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: ai-gateway
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "ee"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-ai-gateway"
          serviceAccountRef:
            name: "eso-vault-auth"
