# ServiceAccount used by the ClusterSecretStore to authenticate to Vault.
#
# Must live in the same namespace as ESO (external-secrets). ESO generates a
# short-lived projected token for this SA and exchanges it with Vault's
# Kubernetes auth backend for a Vault token.
#
# The Vault role 'eso-cluster' (created by init.sh) binds this SA.
# Apply before deploying the ClusterSecretStore.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth-cluster
  namespace: external-secrets
