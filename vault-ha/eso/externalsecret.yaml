# Example ExternalSecret — pulls the entire 'ai-gateway/example' KV document
# from Vault and materialises it as a K8s Secret named 'example-secrets'.
#
# Uses the namespaced SecretStore (vault-backend) in ai-gateway.
# For a cross-namespace secret, switch to ClusterSecretStore:
#   secretStoreRef:
#     name: vault-cluster-backend
#     kind: ClusterSecretStore
#
# The 'extract' method pulls every key in the KV document as a separate
# secret key — no need to enumerate keys individually.
#
# Seed the Vault secret first:
#   vault kv put ee/ai-gateway/example SOME_API_KEY=abc123
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-secrets
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: example-secrets
    # Owner: deleting this ExternalSecret also deletes example-secrets.
    creationPolicy: Owner
  dataFrom:
    # 'extract' pulls the full KV v2 document at ee/data/ai-gateway/example.
    # Path is relative to the mount ('ee'), so full Vault path = ee/data/ai-gateway/example.
    - extract:
        key: ai-gateway/example
