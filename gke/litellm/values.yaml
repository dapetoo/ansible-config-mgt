# LiteLLM — Helm chart 1.82.3
# OCI registry: oci://ghcr.io/berriai/litellm-helm
#
# Secret flow: Vault (dev) → ESO → litellm-secrets (K8s Secret) → env vars
#
# DATABASE_URL is injected from litellm-secrets (seeded into Vault).
# The migration job template does not mount environmentSecrets, so DATABASE_URL
# is passed explicitly via secretKeyRef in migrationJob.extraEnvVars.

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm-database
  tag: ""
  pullPolicy: IfNotPresent

environmentSecrets:
  - litellm-secrets

masterkeySecretName: "litellm-secrets"
masterkeySecretKey: "LITELLM_MASTER_KEY"

db:
  deployStandalone: false
  useExisting: false

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "3Gi"
    cpu: "1000m"

proxyConfigMap:
  create: true

proxy_config:
  model_list:
    - model_name: gpt-4o
      litellm_params:
        model: openai/gpt-4o
        api_key: os.environ/OPENAI_API_KEY

    - model_name: claude-sonnet-4-6
      litellm_params:
        model: anthropic/claude-sonnet-4-6
        api_key: os.environ/ANTHROPIC_API_KEY

    - model_name: gemini-2.5-flash-lite
      litellm_params:
        model: gemini/gemini-2.5-flash-lite
        api_key: AIzaSyB1GELc_Met9o-zWALKbwzR1BPUAgLVQ4M

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    database_url: os.environ/DATABASE_URL

migrationJob:
  enabled: true
  ttlSecondsAfterFinished: 120
  backoffLimit: 4
  extraEnvVars:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: DATABASE_URL
  hooks:
    argocd:
      enabled: false
    helm:
      enabled: true
