# SecretStore (namespaced) — scoped to the litellm namespace.
# Only ExternalSecrets in litellm can reference this store.
# Uses the eso-vault-auth SA and Vault role 'litellm'.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: litellm
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "litellm"
          serviceAccountRef:
            name: "eso-vault-auth"
