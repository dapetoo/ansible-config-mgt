# ClusterSecretStore — cluster-wide Vault backend.
# Any namespace can reference this store using:
#   secretStoreRef:
#     name: vault-cluster-backend
#     kind: ClusterSecretStore
#
# Uses the eso-vault-auth-cluster SA (in external-secrets ns) and
# Vault role 'litellm-cluster'. Both are created by seed-secrets.sh.
# The namespace field in serviceAccountRef is required for ClusterSecretStore.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "litellm-cluster"
          serviceAccountRef:
            name: "eso-vault-auth-cluster"
            namespace: "external-secrets"
