# ExternalSecret — pulls all keys from Vault path 'secret/litellm/api-keys'
# and materialises them as the 'litellm-secrets' K8s Secret in litellm namespace.
#
# Keys produced (must all be seeded into Vault by seed-secrets.sh):
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, LITELLM_MASTER_KEY,
#   DATABASE_USERNAME, DATABASE_PASSWORD
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: litellm/api-keys
