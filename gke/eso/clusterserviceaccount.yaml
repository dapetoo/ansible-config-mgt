# ServiceAccount for the ClusterSecretStore.
# Must live in the ESO namespace (external-secrets) — ClusterSecretStore
# requires the namespace to be specified explicitly in serviceAccountRef.
# Bound to Vault role 'litellm-cluster' by seed-secrets.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-auth-cluster
  namespace: external-secrets
